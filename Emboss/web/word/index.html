<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emboss for Microsoft Word</title>
  <!-- Office.js SDK -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- Liblouis WASM glue -->
  <script src="/engine/liblouis-wasm.js"></script>
  <script src="/web/vendor/temml.min.js"></script>
  <link rel="stylesheet" href="../style.css" />
  <style>
    @font-face {
      font-family: "APHfont";
      src: url("/web/fonts/APH_Braille_Shadows.woff2") format("woff2"),
           url("/web/fonts/APH_Braille_Shadows.woff") format("woff"),
           url("/web/fonts/APH_Braille_Shadows.ttf") format("truetype");
      font-weight: normal; font-style: normal; font-display: swap;
      unicode-range: U+2800-28FF;
    }
    :root {
      --word-accent: #0078d4;
      --bg: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #21262d;
      --line: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --braille-font: "APHfont", "Apple Braille", "Segoe UI Symbol", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }
    .brand svg { width: 18px; height: 18px; fill: currentColor; }
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(46, 160, 67, 0.2);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-badge.syncing {
      background: rgba(210, 153, 34, 0.2);
      color: #d29922;
      border-color: rgba(210, 153, 34, 0.4);
    }
    .status-badge.offline {
      background: rgba(248, 81, 73, 0.2);
      color: #f85149;
      border-color: rgba(248, 81, 73, 0.4);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .toolbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .select-sm {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      outline: none;
      flex: 1;
      min-width: 120px;
    }
    .btn-sm {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn-sm:hover {
      background: #30363d;
      border-color: #8b949e;
    }
    .btn-primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #fff;
    }
    .btn-primary:hover {
      background: #2ea043;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
      gap: 8px;
    }
    .braille-card {
      flex: 1;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .braille-card-header {
      background: #12151a;
      border-bottom: 1px solid var(--line);
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
    }
    .braille-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-family: var(--braille-font);
      font-size: 20px;
      line-height: 1.5;
      color: #58a6ff;
      letter-spacing: 2px;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }
    .braille-viewport.mode-ascii {
      font-family: "SimBraille", "Lucida Console", Monaco, monospace;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .braille-line {
      display: flex;
      padding: 1px 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .braille-line:hover {
      background: rgba(88, 166, 255, 0.1);
    }
    .braille-line.active {
      background: rgba(88, 166, 255, 0.25);
      border-left: 2px solid #58a6ff;
    }
    .info-bar {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .deliverables-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .deliverables-grid button {
      justify-content: center;
      padding: 6px 4px;
    }
    .proofread-badge {
      color: #e3b341;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    #errorMsg {
      display: none;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #ff7b72;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><circle cx="7" cy="6" r="2.5"/><circle cx="7" cy="12" r="2.5"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="12" r="2.5"/><circle cx="17" cy="18" r="2.5"/></svg>
      <span>Emboss</span>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Word Connected</span>
    </div>
  </header>

  <div class="toolbar">
    <select id="selBrailleCode" class="select-sm" title="Braille Translation Table">
      <option value="en-ueb-g2" selected>English (UEB Contracted)</option>
      <option value="en-ueb-g1">English (UEB Uncontracted)</option>
      <option value="en-us-g2">English (US Nemeth Math)</option>
      <option value="es-g1">Spanish Braille</option>
      <option value="fr-g1">French Braille</option>
      <option value="de-g1">German Braille</option>
    </select>
    <select id="selDisplayMode" class="select-sm" style="max-width: 105px;" title="Display Font Mode">
      <option value="aph" selected>⠿ APH Braille</option>
      <option value="ascii">Aa ASCII BRF</option>
    </select>
    <button id="btnInsertSample" class="btn-sm" title="Insert formatted sample content into Word">📝 Sample</button>
    <button id="btnInsertMath" class="btn-sm" title="Insert Mathematics & Equations into Word">∑ Math</button>
    <button id="btnRefresh" class="btn-sm" title="Force re-sync from Word document">🔄 Refresh</button>
  </div>

  <div class="main-content">
    <div id="errorMsg"></div>

    <div class="braille-card">
      <div class="braille-card-header">
        <span>Live Formatted Braille (BRF)</span>
        <span id="pageStats">0 cells · 0 lines</span>
      </div>
      <div id="brailleView" class="braille-viewport" tabindex="0" role="region" aria-label="Live Braille Preview">
        Connecting to Word document...
      </div>
    </div>

    <div class="info-bar">
      <span id="styleInspector">Style: Paragraph (3-1)</span>
      <span id="proofreadSummary" class="proofread-badge">✓ Verified 100%</span>
    </div>

    <div class="deliverables-grid">
      <button id="btnCopyBraille" class="btn-sm">📋 Copy BRF</button>
      <button id="btnDownloadBrf" class="btn-sm btn-primary">💾 Save BRF</button>
      <button id="btnDownloadPef" class="btn-sm">📄 PEF 1.0</button>
      <button id="btnDownloadEbraille" class="btn-sm">📱 eBraille</button>
      <button id="btnEmboss" class="btn-sm" style="grid-column: span 2; justify-content: center; background: #1f6feb; color: #fff; border-color: rgba(240, 246, 252, 0.1);">🖨 Emboss Document</button>
    </div>
  </div>

  <script type="module" src="./word.mjs"></script>
</body>
</html>
