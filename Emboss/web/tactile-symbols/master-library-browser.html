  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-border: #24324f;
      --text-main: #f1f5f9;
      --text-muted: #8da2c0;
      --accent: #38bdf8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      padding: 1.5rem;
    }
    .header {
      max-width: 1400px;
      margin: 0 auto 1.5rem auto;
      text-align: center;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-weight: 700;
      color: var(--accent);
      font-size: 0.9rem;
    }
    .controls {
      max-width: 1400px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .search {
      width: 100%;
      padding: 0.85rem 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 120px;
      overflow-y: auto;
      padding: 4px;
    }
    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.25rem 0.65rem;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
    }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .thumb-frame {
      width: 100px;
      height: 100px;
      background: #ffffff;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.6rem;
      overflow: hidden;
    }
    .thumb-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .card-id {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }
    .card-desc {
      font-size: 0.75rem;
      color: var(--text-main);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pagination {
      max-width: 1400px;
      margin: 2rem auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }
    .page-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
    }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>

    <button class="page-btn" id="prev-btn">◀ Previous Page</button>
    <span id="page-info" style="font-size:0.9rem; color:var(--text-muted);">Page 1 of 151</span>
    <button class="page-btn" id="next-btn">Next Page ▶</button>
  </div>

  <script>
    let symbols = [];
    let filtered = [];
    let currentPage = 1;
    const PAGE_SIZE = 100;
    let activeCat = "ALL";

    fetch("master-catalog.json")
      .then(r => r.json())
      .then(data => {
        symbols = data.symbols;
        filtered = symbols;
        render();
      });

    const searchInput = document.getElementById("search");
    const catBtns = document.querySelectorAll(".cat-btn");
    const grid = document.getElementById("grid");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const pageInfo = document.getElementById("page-info");
    const filteredCount = document.getElementById("filtered-count");

    function applyFilter() {
      const q = searchInput.value.toLowerCase().trim();
      filtered = symbols.filter(s => {
        const matchesCat = activeCat === "ALL" || s.category === activeCat;
        const matchesQuery = !q || s.file.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || String(s.id).includes(q);
        return matchesCat && matchesQuery;
      });
      currentPage = 1;
      filteredCount.textContent = filtered.length;
      render();
    }

    searchInput.addEventListener("input", applyFilter);

    catBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        catBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.getAttribute("data-cat");
        applyFilter();
      });
    });

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        render();
        window.scrollTo({ top: 200, behavior: "smooth" });
      }
    });

    nextBtn.addEventListener("click", () => {
      const maxPage = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      if (currentPage < maxPage) {
        currentPage++;
        render();
        window.scrollTo({ top: 200, behavior: "smooth" });
      }
    });

    function render() {
      const maxPage = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      pageInfo.textContent = `Page ${currentPage} of ${maxPage}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === maxPage;

      grid.innerHTML = pageItems.map(item => `
        <div class="card">
          <div class="thumb-frame">
            <img src="master/${item.file}" loading="lazy" alt="${item.file}">
          </div>
          <div class="card-id">#${item.id} • ${item.category.toUpperCase()}</div>
          <div class="card-desc" title="${item.desc}">${item.desc}</div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
