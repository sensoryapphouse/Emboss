<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Sensor housing cover plate with precision pinhole in center with bold 4.5px stroke -->
  <rect x="20" y="20" width="60" height="60" rx="6" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Four quadrant silicon photodiode cells with bold 4.0px strokes -->
  <rect x="28" y="28" width="20" height="20" rx="2" fill="#0284c7"/>
  <rect x="52" y="28" width="20" height="20" rx="2" fill="#0284c7"/>
  <rect x="28" y="52" width="20" height="20" rx="2" fill="#0284c7"/>
  <rect x="52" y="52" width="20" height="20" rx="2" fill="#0284c7"/>
  <!-- Sunlight illumination spot crossing quadrants in center -->
  <circle cx="50" cy="50" r="5" fill="#facc15" stroke="#ef4444" stroke-width="2.5"/>
</svg>