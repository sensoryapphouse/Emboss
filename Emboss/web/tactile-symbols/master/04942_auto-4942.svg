<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Chassis center baseline connecting rear and front wheel with bold 5.0px stroke -->
  <line x1="28" y1="50" x2="72" y2="50" stroke="#000000" stroke-width="5.5"/>
  <!-- Rear wheel fixed straight and front wheel steered at angle delta with bold 5.0px strokes -->
  <rect x="22" y="36" width="8" height="28" rx="2" fill="#1e293b"/>
  <rect x="68" y="36" width="8" height="28" rx="2" fill="#ef4444" transform="rotate(-25 72 50)"/>
  <!-- Center of gravity (CG) marker in center -->
  <circle cx="48" cy="50" r="5" fill="#0284c7"/>
</svg>