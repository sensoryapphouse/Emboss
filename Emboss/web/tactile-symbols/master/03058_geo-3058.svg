  <!-- Ground surface line horizontal with bold 5.0px stroke -->
  <line x1="18" y1="30" x2="82" y2="30" stroke="#8a5a2b" stroke-width="6.0"/>
  <!-- Surface Epicenter point top with bold 4.0px stroke -->
  <circle cx="50" cy="30" r="6" fill="#ef4444" stroke="#000000" stroke-width="4.0"/>
  <!-- Underground Focus / Hypocenter point bottom with bold 4.5px stroke -->
  <circle cx="50" cy="62" r="7" fill="#facc15" stroke="#000000" stroke-width="4.5"/>
  <!-- Concentric seismic wave circles radiating upward with bold 4.0px strokes -->
  <circle cx="50" cy="62" r="14" fill="none" stroke="#ef4444" stroke-width="4.0"/>
  <circle cx="50" cy="62" r="22" fill="none" stroke="#ef4444" stroke-width="4.0"/>
