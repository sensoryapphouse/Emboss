  <!-- Massive 230 MeV isochronous cyclotron magnet ring with bold 5.0px stroke -->
  <circle cx="50" cy="50" r="32" fill="#ffffff" stroke="#000000" stroke-width="5.0"/>
  <!-- Four spiral sector flutter magnetic poles with bold 4.0px strokes -->
  <circle cx="50" cy="30" r="6" fill="#1e293b"/>
  <circle cx="70" cy="50" r="6" fill="#1e293b"/>
  <circle cx="50" cy="70" r="6" fill="#1e293b"/>
  <circle cx="30" cy="50" r="6" fill="#1e293b"/>
  <!-- High energy proton beamline exit right with bold 4.5px stroke -->
  <line x1="72" y1="50" x2="86" y2="50" stroke="#ef4444" stroke-width="5.5"/>
</svg>