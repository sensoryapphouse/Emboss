<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Magneto-optical Faraday glass rod in center with bold 4.5px stroke -->
  <rect x="28" y="36" width="44" height="28" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Polarized light entering vertically left with bold 4.5px stroke -->
  <line x1="18" y1="30" x2="18" y2="70" stroke="#0284c7" stroke-width="5.0"/>
  <!-- Rotated polarization vector exiting at angle right with bold 4.5px stroke -->
  <line x1="82" y1="36" x2="82" y2="64" stroke="#ef4444" stroke-width="5.0" transform="rotate(35 82 50)"/>
</svg>