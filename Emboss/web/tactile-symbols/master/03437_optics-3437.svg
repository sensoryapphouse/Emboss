  <!-- Diffracted sound wave grating ripples with bold 3.5px strokes -->
  <line x1="30" y1="36" x2="70" y2="36" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="3,3"/>
  <line x1="30" y1="50" x2="70" y2="50" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="3,3"/>
  <line x1="30" y1="64" x2="70" y2="64" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="3,3"/>
