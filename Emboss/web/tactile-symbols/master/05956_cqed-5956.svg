  <!-- Central tunable SQUID loop coupler between two qubit nodes with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="16" fill="#ffffff" stroke="#ef4444" stroke-width="4.5"/>
  <!-- Flux modulation control line top with bold 5.0px stroke -->
  <line x1="50" y1="16" x2="50" y2="34" stroke="#000000" stroke-width="5.0" stroke-linecap="round"/>
  <!-- Coupling arms left and right -->
  <line x1="16" y1="50" x2="34" y2="50" stroke="#0284c7" stroke-width="5.0"/>
  <line x1="66" y1="50" x2="84" y2="50" stroke="#0284c7" stroke-width="5.0"/>
</svg>