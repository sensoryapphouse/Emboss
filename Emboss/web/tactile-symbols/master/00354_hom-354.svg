<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Top and bottom watch straps -->
  <rect x="40" y="12" width="20" height="18" fill="#8a5a2b" stroke="#000000" stroke-width="3.5"/>
  <rect x="40" y="70" width="20" height="18" fill="#8a5a2b" stroke="#000000" stroke-width="3.5"/>
  <!-- Circular watch case -->
  <circle cx="50" cy="50" r="24" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Hands pointing to 3:00 -->
  <line x1="50" y1="50" x2="50" y2="34" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="64" y2="50" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
</svg>