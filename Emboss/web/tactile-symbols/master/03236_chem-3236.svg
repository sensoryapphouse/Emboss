  <!-- Central alpha carbon with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="10" fill="#1e293b" stroke="#000000" stroke-width="4.0"/>
  <!-- Positive ammonium group left (-NH3+) with bold 4.0px stroke -->
  <circle cx="24" cy="50" r="8" fill="#0284c7" stroke="#000000" stroke-width="3.5"/>
  <line x1="32" y1="50" x2="40" y2="50" stroke="#000000" stroke-width="5.0"/>
  <!-- Negative carboxylate group right (-COO-) with bold 4.0px stroke -->
  <circle cx="76" cy="50" r="8" fill="#ef4444" stroke="#000000" stroke-width="3.5"/>
  <line x1="60" y1="50" x2="68" y2="50" stroke="#000000" stroke-width="5.0"/>
</svg>