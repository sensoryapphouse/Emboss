  <!-- Tapered lighthouse masonry tower -->
  <polygon points="40,30 60,30 68,82 32,82" fill="#ffffff" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Bold red middle stripe -->
  <polygon points="37,48 63,48 65,64 35,64" fill="#ef4444"/>
  <!-- Lantern room top -->
  <rect x="42" y="18" width="16" height="12" rx="2" fill="#facc15" stroke="#000000" stroke-width="3.5"/>
  <!-- Radiant light beam extending left and right -->
  <line x1="42" y1="24" x2="16" y2="18" stroke="#facc15" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="58" y1="24" x2="84" y2="18" stroke="#facc15" stroke-width="4.5" stroke-linecap="round"/>
</svg>