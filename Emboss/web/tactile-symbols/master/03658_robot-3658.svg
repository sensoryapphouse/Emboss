  <!-- Left and right power rails with bold 5.0px strokes -->
  <line x1="18" y1="20" x2="18" y2="80" stroke="#000000" stroke-width="5.5"/>
  <line x1="82" y1="20" x2="82" y2="80" stroke="#000000" stroke-width="5.5"/>
  <!-- Horizontal logic rung with bold 4.5px stroke -->
  <line x1="18" y1="50" x2="36" y2="50" stroke="#000000" stroke-width="4.5"/>
  <line x1="48" y1="50" x2="62" y2="50" stroke="#000000" stroke-width="4.5"/>
  <line x1="74" y1="50" x2="82" y2="50" stroke="#000000" stroke-width="4.5"/>
  <!-- Normally Open (NO) contact parallel bars with bold 4.5px strokes -->
  <line x1="36" y1="40" x2="36" y2="60" stroke="#0284c7" stroke-width="5.0"/>
  <line x1="48" y1="40" x2="48" y2="60" stroke="#0284c7" stroke-width="5.0"/>
  <!-- Output Relay Coil circle with bold 4.0px stroke -->
  <circle cx="68" cy="50" r="6" fill="none" stroke="#ef4444" stroke-width="4.0"/>
