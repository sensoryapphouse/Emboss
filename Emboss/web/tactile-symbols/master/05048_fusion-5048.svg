  <!-- Deuterium (1 proton, 1 neutron) left with bold 4.5px stroke -->
  <circle cx="26" cy="38" r="8" fill="#ffffff" stroke="#ef4444" stroke-width="4.0"/>
  <!-- Tritium (1 proton, 2 neutrons) left with bold 4.5px stroke -->
  <circle cx="26" cy="62" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="4.0"/>
  <!-- Fusion reaction energy release starburst center with bold 4.5px stroke -->
  <polygon points="50,42 54,48 60,50 54,52 50,58 46,52 40,50 46,48" fill="#facc15"/>
  <!-- Alpha particle Helium-4 (3.5 MeV) top-right with bold 4.5px stroke -->
  <circle cx="74" cy="36" r="10" fill="#22c55e" stroke="#000000" stroke-width="3.5"/>
  <!-- High-energy 14.1 MeV Neutron exiting bottom-right with bold 4.5px stroke -->
  <circle cx="74" cy="64" r="6" fill="#1e293b"/>
</svg>