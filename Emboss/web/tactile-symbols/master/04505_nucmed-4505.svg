<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Positron-electron annihilation point in center with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="6" fill="#ef4444"/>
  <!-- Two collinear 511 keV gamma photons travelling 180-degrees opposite with bold 5.0px stroke -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#0284c7" stroke-width="5.5" stroke-dasharray="6,3"/>
  <!-- Opposing PET scintillation detector blocks left and right with bold 4.5px strokes -->
  <rect x="14" y="38" width="10" height="24" rx="2" fill="#1e293b"/>
  <rect x="76" y="38" width="10" height="24" rx="2" fill="#1e293b"/>
</svg>