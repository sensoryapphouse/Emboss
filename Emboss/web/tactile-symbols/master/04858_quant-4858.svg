  <!-- Left qubit pad and right qubit pad with bold 4.5px strokes -->
  <rect x="16" y="38" width="18" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4.0"/>
  <rect x="66" y="38" width="18" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4.0"/>
  <!-- Tunable SQUID coupler loop in center with bold 4.5px stroke -->
  <ellipse cx="50" cy="50" rx="10" ry="14" fill="none" stroke="#ef4444" stroke-width="4.5"/>
  <!-- Fast magnetic flux bias line above coupler loop with bold 4.5px stroke -->
  <line x1="50" y1="18" x2="50" y2="34" stroke="#0284c7" stroke-width="5.0"/>
</svg>