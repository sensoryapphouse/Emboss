<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Water flotation tank vessel with bold 4.5px stroke -->
  <rect x="20" y="30" width="60" height="46" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Water surface line with bold 4.0px stroke -->
  <line x1="20" y1="44" x2="80" y2="44" stroke="#0284c7" stroke-width="4.5"/>
  <!-- Floating light polyolefins (PE/PP) on top with bold 4.0px strokes -->
  <circle cx="36" cy="40" r="4" fill="#22c55e"/>
  <circle cx="64" cy="40" r="4" fill="#22c55e"/>
  <!-- Sinking heavy plastics (PET/PVC) on bottom with bold 4.0px strokes -->
  <circle cx="40" cy="68" r="4" fill="#ef4444"/>
  <circle cx="60" cy="68" r="4" fill="#ef4444"/>
</svg>