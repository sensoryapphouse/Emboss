  <!-- Individual bathymetric sounding beams with bold 3.5px strokes -->
  <line x1="50" y1="32" x2="38" y2="82" stroke="#0284c7" stroke-width="3.5"/>
  <line x1="50" y1="32" x2="62" y2="82" stroke="#0284c7" stroke-width="3.5"/>
