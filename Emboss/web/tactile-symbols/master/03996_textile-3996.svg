  <!-- Outer border frame with bold 4.5px stroke -->
  <rect x="20" y="20" width="60" height="60" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Alternating checkerboard interlacement blocks with bold 3.5px strokes -->
  <rect x="20" y="20" width="30" height="30" fill="#0284c7" stroke="#000000" stroke-width="3.5"/>
  <rect x="50" y="50" width="30" height="30" fill="#0284c7" stroke="#000000" stroke-width="3.5"/>
  <rect x="50" y="20" width="30" height="30" fill="#facc15" stroke="#000000" stroke-width="3.5"/>
  <rect x="20" y="50" width="30" height="30" fill="#facc15" stroke="#000000" stroke-width="3.5"/>
</svg>