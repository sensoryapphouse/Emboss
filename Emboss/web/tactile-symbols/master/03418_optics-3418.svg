<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Dielectric surface interface horizontal with bold 4.5px stroke -->
  <line x1="18" y1="54" x2="82" y2="54" stroke="#000000" stroke-width="5.0"/>
  <!-- Incident unpolarized ray with bold 4.5px stroke -->
  <line x1="22" y1="28" x2="50" y2="54" stroke="#000000" stroke-width="5.0"/>
  <!-- 100% Polarized reflected ray at 90 degrees to refracted ray with bold 4.5px stroke -->
  <line x1="50" y1="54" x2="76" y2="28" stroke="#ef4444" stroke-width="5.5"/>
  <!-- Refracted ray into dielectric with bold 4.0px stroke -->
  <line x1="50" y1="54" x2="72" y2="80" stroke="#0284c7" stroke-width="4.5"/>
</svg>