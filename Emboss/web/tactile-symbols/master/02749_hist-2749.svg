<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Triangular triangular pediment gable top -->
  <polygon points="50,18 84,36 16,36" fill="#facc15" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Horizontal entablature beam -->
  <rect x="18" y="36" width="64" height="8" fill="#94a3b8" stroke="#000000" stroke-width="3.5"/>
  <!-- 4 Front Doric column pillars with bold 4.0px strokes -->
  <line x1="24" y1="44" x2="24" y2="76" stroke="#000000" stroke-width="4.5"/>
  <line x1="41" y1="44" x2="41" y2="76" stroke="#000000" stroke-width="4.5"/>
  <line x1="59" y1="44" x2="59" y2="76" stroke="#000000" stroke-width="4.5"/>
  <line x1="76" y1="44" x2="76" y2="76" stroke="#000000" stroke-width="4.5"/>
  <!-- Stepped stylobate base platform -->
  <rect x="14" y="76" width="72" height="8" rx="2" fill="#94a3b8" stroke="#000000" stroke-width="4.0"/>
</svg>