  <!-- Outer grid container with bold 4.5px stroke -->
  <rect x="18" y="20" width="64" height="60" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- 4 Column sectors: Quarks, Leptons, Gauge Bosons, Higgs with bold 3.5px strokes -->
  <line x1="34" y1="20" x2="34" y2="80" stroke="#000000" stroke-width="3.5"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="#000000" stroke-width="3.5"/>
  <line x1="66" y1="20" x2="66" y2="80" stroke="#000000" stroke-width="3.5"/>
  <!-- Quarks column left -->
  <rect x="20" y="22" width="12" height="16" fill="#93c5fd"/>
  <!-- Higgs boson cell top right -->
  <rect x="68" y="22" width="12" height="16" fill="#fde047"/>
</svg>