  <!-- Two-floor red bus body profile with bold 4.5px stroke -->
  <rect x="20" y="24" width="60" height="50" rx="4" fill="#ef4444" stroke="#000000" stroke-width="4.5"/>
  <!-- Upper deck window ribbon with bold 3.5px stroke -->
  <line x1="26" y1="36" x2="74" y2="36" stroke="#ffffff" stroke-width="6.0"/>
  <!-- Lower deck window ribbon with bold 3.5px stroke -->
  <line x1="26" y1="54" x2="74" y2="54" stroke="#ffffff" stroke-width="6.0"/>
  <!-- Heavy road wheels with bold 4.0px strokes -->
  <circle cx="34" cy="74" r="7" fill="#1e293b" stroke="#000000" stroke-width="4.0"/>
  <circle cx="68" cy="74" r="7" fill="#1e293b" stroke="#000000" stroke-width="4.0"/>
</svg>