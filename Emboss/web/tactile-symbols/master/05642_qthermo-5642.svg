  <!-- 3 quantum wires with bold 4.5px strokes -->
  <line x1="16" y1="28" x2="84" y2="28" stroke="#000000" stroke-width="4.5"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="4.5"/>
  <line x1="16" y1="72" x2="84" y2="72" stroke="#000000" stroke-width="4.5"/>
  <!-- Two control dots on top wires with bold 4.5px stroke -->
  <circle cx="50" cy="28" r="5" fill="#ef4444"/>
  <circle cx="50" cy="50" r="5" fill="#ef4444"/>
  <line x1="50" y1="28" x2="50" y2="72" stroke="#ef4444" stroke-width="4.5"/>
  <!-- Target NOT circle on bottom wire -->
  <circle cx="50" cy="72" r="7" fill="#ffffff" stroke="#0284c7" stroke-width="4.0"/>
</svg>