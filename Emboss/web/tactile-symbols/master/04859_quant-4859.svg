<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Unit sphere boundary and equator ellipse with bold 4.5px strokes -->
  <circle cx="50" cy="50" r="32" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <ellipse cx="50" cy="50" rx="32" ry="12" fill="none" stroke="#cbd5e1" stroke-width="3.5"/>
  <!-- North |0> pole and South |1> pole axis with bold 4.5px stroke -->
  <line x1="50" y1="16" x2="50" y2="84" stroke="#000000" stroke-width="4.5"/>
  <!-- State vector arrow pointing in superposition with bold 5.0px stroke -->
  <line x1="50" y1="50" x2="72" y2="32" stroke="#ef4444" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="4" fill="#000000"/>
</svg>