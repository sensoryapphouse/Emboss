  <!-- Multiple fluctuating field paths between initial and final states with bold 4.5px strokes -->
  <circle cx="20" cy="50" r="6" fill="#0284c7"/>
  <circle cx="80" cy="50" r="6" fill="#ef4444"/>
  <path d="M 20 50 L 80 50" stroke="#000000" stroke-width="5.0"/>
  <path d="M 20 50 Q 50 20 80 50" fill="none" stroke="#0284c7" stroke-width="4.0"/>
  <path d="M 20 50 Q 50 80 80 50" fill="none" stroke="#0284c7" stroke-width="4.0"/>
</svg>