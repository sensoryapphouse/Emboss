<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- 2D top-down grid square matrix with bold 4.5px stroke -->
  <rect x="20" y="20" width="60" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <line x1="40" y1="20" x2="40" y2="80" stroke="#cbd5e1" stroke-width="3.5"/>
  <line x1="60" y1="20" x2="60" y2="80" stroke="#cbd5e1" stroke-width="3.5"/>
  <line x1="20" y1="40" x2="80" y2="40" stroke="#cbd5e1" stroke-width="3.5"/>
  <line x1="20" y1="60" x2="80" y2="60" stroke="#cbd5e1" stroke-width="3.5"/>
  <!-- Occupied probability cells P=1.0 in dark and P=0.5 in yellow with bold 3.5px strokes -->
  <rect x="40" y="40" width="20" height="20" fill="#1e293b"/>
  <rect x="60" y="20" width="20" height="20" fill="#facc15"/>
</svg>