<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Copper electrode plates top and bottom with bold 4.5px strokes -->
  <line x1="38" y1="28" x2="74" y2="28" stroke="#ca8a04" stroke-width="5.0"/>
  <line x1="38" y1="72" x2="74" y2="72" stroke="#ca8a04" stroke-width="5.0"/>
  <!-- Solid PTFE Teflon fuel bar spring-fed from left with bold 4.5px stroke -->
  <rect x="18" y="38" width="30" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4.0"/>
  <!-- Pulsed electric spark discharge arc vaporizing fuel with bold 5.0px stroke -->
  <polygon points="54,34 64,50 54,66 60,50" fill="#ef4444"/>
  <!-- Exhaust pulse expanding right with bold 4.0px stroke -->
  <line x1="74" y1="50" x2="86" y2="50" stroke="#0284c7" stroke-width="5.0" stroke-linecap="round"/>
</svg>