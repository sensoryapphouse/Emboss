  <!-- 1D tight-binding paired lattice bonds with bold 4.5px strokes -->
  <line x1="30" y1="50" x2="48" y2="50" stroke="#0284c7" stroke-width="5.0"/>
  <line x1="52" y1="50" x2="70" y2="50" stroke="#0284c7" stroke-width="5.0"/>
  <!-- Paired internal Majorana sites -->
  <circle cx="30" cy="50" r="5" fill="#0284c7"/>
  <circle cx="48" cy="50" r="5" fill="#0284c7"/>
  <circle cx="52" cy="50" r="5" fill="#0284c7"/>
  <circle cx="70" cy="50" r="5" fill="#0284c7"/>
  <!-- Unpaired isolated zero modes at boundaries with bold 4.5px strokes -->
  <circle cx="16" cy="50" r="7" fill="#ef4444"/>
  <circle cx="84" cy="50" r="7" fill="#ef4444"/>
