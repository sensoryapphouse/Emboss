<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Earth surface curve -->
  <line x1="14" y1="82" x2="86" y2="82" stroke="#000000" stroke-width="4.5"/>
  <!-- Equatorial convective rising updraft at ITCZ (center) -->
  <line x1="50" y1="80" x2="50" y2="24" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="44,28 50,18 56,28" fill="#ef4444"/>
  <!-- Upper tropospheric poleward flow -->
  <line x1="50" y1="24" x2="22" y2="24" stroke="#000000" stroke-width="3.5"/>
  <line x1="50" y1="24" x2="78" y2="24" stroke="#000000" stroke-width="3.5"/>
  <!-- Subtropical subsiding downdraft at 30 deg latitude -->
  <line x1="22" y1="24" x2="22" y2="76" stroke="#0284c7" stroke-width="3.5"/>
  <line x1="78" y1="24" x2="78" y2="76" stroke="#0284c7" stroke-width="3.5"/>
</svg>