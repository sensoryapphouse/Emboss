<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- 3 Shielding barriers: Paper, Aluminum, Lead with bold 4.0px strokes -->
  <line x1="40" y1="20" x2="40" y2="80" stroke="#cbd5e1" stroke-width="4.5"/>
  <line x1="60" y1="20" x2="60" y2="80" stroke="#94a3b8" stroke-width="6.0"/>
  <line x1="80" y1="20" x2="80" y2="80" stroke="#1e293b" stroke-width="9.0"/>
  <!-- Alpha stopped at paper with bold 4.0px stroke -->
  <line x1="18" y1="30" x2="40" y2="30" stroke="#ef4444" stroke-width="4.5"/>
  <!-- Beta stopped at aluminum with bold 4.0px stroke -->
  <line x1="18" y1="50" x2="60" y2="50" stroke="#0284c7" stroke-width="4.5"/>
  <!-- Gamma penetrating through lead with bold 4.0px stroke -->
  <line x1="18" y1="70" x2="84" y2="70" stroke="#facc15" stroke-width="4.5"/>
</svg>