  <!-- Outer rectangular truss box frame with bold 4.5px stroke -->
  <rect x="18" y="36" width="64" height="34" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Vertical compression posts with bold 4.0px strokes -->
  <line x1="34" y1="36" x2="34" y2="70" stroke="#000000" stroke-width="4.0"/>
  <line x1="50" y1="36" x2="50" y2="70" stroke="#000000" stroke-width="4.0"/>
  <line x1="66" y1="36" x2="66" y2="70" stroke="#000000" stroke-width="4.0"/>
  <!-- Inward slanting tension diagonals with bold 4.0px strokes -->
  <line x1="18" y1="36" x2="34" y2="70" stroke="#0284c7" stroke-width="4.5"/>
  <line x1="50" y1="36" x2="34" y2="70" stroke="#0284c7" stroke-width="4.5"/>
  <line x1="50" y1="36" x2="66" y2="70" stroke="#0284c7" stroke-width="4.5"/>
  <line x1="82" y1="36" x2="66" y2="70" stroke="#0284c7" stroke-width="4.5"/>
</svg>