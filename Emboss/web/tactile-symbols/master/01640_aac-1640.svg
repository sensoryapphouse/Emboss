  <line x1="34" y1="24" x2="34" y2="76" stroke="#000000" stroke-width="3.5"/>
  <line x1="50" y1="24" x2="50" y2="76" stroke="#000000" stroke-width="3.5"/>
  <line x1="66" y1="24" x2="66" y2="76" stroke="#000000" stroke-width="3.5"/>
