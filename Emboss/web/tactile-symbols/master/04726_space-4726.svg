  <!-- Earth with North-South spin axis with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="14" fill="#0284c7"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="#1e293b" stroke-width="4.5"/>
  <!-- Retrograde near-polar orbit plane precessing around Earth with bold 5.0px stroke -->
  <ellipse cx="50" cy="50" rx="14" ry="34" fill="none" stroke="#ef4444" stroke-width="5.0" transform="rotate(15 50 50)"/>
</svg>