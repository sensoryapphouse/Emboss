<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Deployed mesh net perimeter with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#0284c7" stroke-width="4.5"/>
  <!-- Grid net mesh lines with bold 3.5px strokes -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#0284c7" stroke-width="3.5"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="#0284c7" stroke-width="3.5"/>
  <!-- Weighted corner masses on perimeter -->
  <circle cx="50" cy="20" r="4" fill="#ef4444"/>
  <circle cx="50" cy="80" r="4" fill="#ef4444"/>
  <circle cx="20" cy="50" r="4" fill="#ef4444"/>
  <circle cx="80" cy="50" r="4" fill="#ef4444"/>
</svg>