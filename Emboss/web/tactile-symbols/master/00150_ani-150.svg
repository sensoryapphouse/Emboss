  <!-- Striped abdomen body -->
  <ellipse cx="50" cy="58" rx="20" ry="26" fill="#facc15" stroke="#000000" stroke-width="4.5"/>
  <!-- Abdomen black stripes with 8mm spacing -->
  <line x1="32" y1="52" x2="68" y2="52" stroke="#000000" stroke-width="4.5"/>
  <line x1="34" y1="66" x2="66" y2="66" stroke="#000000" stroke-width="4.5"/>
  <!-- Head on top -->
  <circle cx="50" cy="26" r="10" fill="#000000" stroke="#000000" stroke-width="3.5"/>
  <!-- Wings left and right -->
  <ellipse cx="26" cy="40" rx="14" ry="7" transform="rotate(-30 26 40)" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
  <ellipse cx="74" cy="40" rx="14" ry="7" transform="rotate(30 74 40)" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
</svg>