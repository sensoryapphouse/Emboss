  <!-- Rotating torus ring outer and inner circumferences with bold 4.5px strokes -->
  <circle cx="50" cy="50" r="32" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <circle cx="50" cy="50" r="18" fill="#ffffff" stroke="#000000" stroke-width="4.0"/>
  <!-- Central non-rotating docking hub in center -->
  <circle cx="50" cy="50" r="7" fill="#ef4444"/>
  <!-- Radial transport elevator spokes connecting hub to ring with bold 3.5px strokes -->
  <line x1="50" y1="18" x2="50" y2="43" stroke="#0284c7" stroke-width="3.5"/>
  <line x1="50" y1="57" x2="50" y2="82" stroke="#0284c7" stroke-width="3.5"/>
</svg>