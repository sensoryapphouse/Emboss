  <!-- Twin vertical structural steel lift towers with bold 4.5px strokes -->
  <line x1="24" y1="20" x2="24" y2="80" stroke="#000000" stroke-width="5.5"/>
  <line x1="76" y1="20" x2="76" y2="80" stroke="#000000" stroke-width="5.5"/>
  <!-- Tower head sheave wheels on top with bold 4.0px strokes -->
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="76" cy="20" r="5" fill="#ef4444"/>
