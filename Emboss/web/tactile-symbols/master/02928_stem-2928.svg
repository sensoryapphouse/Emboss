<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Solid conductive slab with bold 4.0px stroke -->
  <rect x="36" y="28" width="28" height="44" fill="#94a3b8" stroke="#000000" stroke-width="4.0"/>
  <!-- Hot side left (Red) -->
  <line x1="26" y1="28" x2="26" y2="72" stroke="#ef4444" stroke-width="6.0"/>
  <!-- Cold side right (Blue) -->
  <line x1="74" y1="28" x2="74" y2="72" stroke="#0284c7" stroke-width="6.0"/>
  <!-- Heat flux arrow through slab -->
  <line x1="30" y1="50" x2="68" y2="50" stroke="#facc15" stroke-width="6.0"/>
</svg>