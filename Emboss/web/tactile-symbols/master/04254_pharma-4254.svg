  <!-- Column shell with bold 4.5px stroke -->
  <rect x="32" y="18" width="36" height="64" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Porous molecular sieve beads separating large/small molecules with bold 4.0px strokes -->
  <circle cx="50" cy="38" r="8" fill="#ffffff" stroke="#ca8a04" stroke-width="4.0"/>
  <circle cx="50" cy="62" r="8" fill="#ffffff" stroke="#ca8a04" stroke-width="4.0"/>
  <!-- Small molecules entering pores vs large excluded molecules around with bold 3.5px strokes -->
  <circle cx="50" cy="38" r="2.5" fill="#ef4444"/>
  <circle cx="38" cy="50" r="4.5" fill="#0284c7"/>
</svg>