  <!-- Elevated triangular barge hull deck with bold 4.5px stroke -->
  <rect x="24" y="32" width="52" height="14" rx="2" fill="#facc15" stroke="#000000" stroke-width="4.5"/>
  <!-- Vertical open-truss lattice steel legs with bold 4.0px strokes -->
