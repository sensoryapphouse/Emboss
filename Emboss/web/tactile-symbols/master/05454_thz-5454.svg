  <!-- Flat negative-index superlens slab in center with bold 5.0px stroke -->
  <rect x="42" y="18" width="16" height="64" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Sub-wavelength object point source on left with bold 4.5px stroke -->
