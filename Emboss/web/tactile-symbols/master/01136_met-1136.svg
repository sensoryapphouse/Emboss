  <!-- Pacific basin box -->
  <rect x="14" y="24" width="72" height="56" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Steep tilted thermocline with shallow cold tongue on east -->
  <line x1="14" y1="68" x2="86" y2="38" stroke="#0284c7" stroke-width="5.5"/>
  <!-- Strong Trade Winds blowing westward -->
  <line x1="70" y1="32" x2="32" y2="32" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="36,26 26,32 36,38" fill="#000000"/>
