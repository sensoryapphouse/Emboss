  <!-- Jupiter globe with alternating cloud belts with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="28" fill="#fed7aa" stroke="#000000" stroke-width="4.5"/>
  <!-- Horizontal atmospheric dark belt bands with bold 4.0px strokes -->
  <line x1="24" y1="40" x2="76" y2="40" stroke="#b45309" stroke-width="4.5"/>
  <line x1="24" y1="60" x2="76" y2="60" stroke="#b45309" stroke-width="4.5"/>
  <!-- Anticyclonic Great Red Spot storm oval with bold 4.0px stroke -->
  <ellipse cx="60" cy="56" rx="8" ry="5" fill="#ef4444" stroke="#000000" stroke-width="3.0"/>
</svg>