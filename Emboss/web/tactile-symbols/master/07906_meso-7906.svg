  <!-- Two coupled dots with parallel spins blocked from double occupation by Pauli principle with bold 4.5px strokes -->
  <circle cx="34" cy="50" r="14" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <circle cx="66" cy="50" r="14" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <line x1="34" y1="42" x2="34" y2="58" stroke="#ef4444" stroke-width="4.5"/>
  <line x1="66" y1="42" x2="66" y2="58" stroke="#ef4444" stroke-width="4.5"/>
</svg>