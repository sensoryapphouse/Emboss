  <!-- Horizontal mirror surface with bottom hatched backing -->
  <line x1="14" y1="70" x2="86" y2="70" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="22" y1="70" x2="16" y2="78" stroke="#000000" stroke-width="3.0"/>
  <line x1="38" y1="70" x2="32" y2="78" stroke="#000000" stroke-width="3.0"/>
  <line x1="54" y1="70" x2="48" y2="78" stroke="#000000" stroke-width="3.0"/>
  <line x1="70" y1="70" x2="64" y2="78" stroke="#000000" stroke-width="3.0"/>
  <!-- Normal dashed perpendicular line -->
  <line x1="50" y1="20" x2="50" y2="70" stroke="#94a3b8" stroke-width="3.0" stroke-dasharray="4 4"/>
  <!-- Incident light ray (theta_i = 40 deg) -->
  <path d="M 20 34 L 50 70 M 34 50 L 38 52" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Reflected light ray (theta_r = 40 deg) -->
  <path d="M 50 70 L 80 34 M 64 52 L 68 48" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
</svg>