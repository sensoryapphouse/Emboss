  <!-- Outer rigid cell wall -->
  <rect x="14" y="14" width="72" height="72" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Inner cell membrane -->
  <rect x="22" y="22" width="56" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="3.0"/>
  <!-- Large central vacuole -->
  <rect x="36" y="32" width="36" height="36" rx="6" fill="#38bdf8" stroke="#000000" stroke-width="3.5"/>
  <!-- Nucleus on left -->
  <circle cx="29" cy="38" r="6" fill="#ef4444" stroke="#000000" stroke-width="3.0"/>
  <!-- Chloroplast oval -->
  <ellipse cx="29" cy="62" rx="5" ry="3" fill="#22c55e" stroke="#000000" stroke-width="2.5"/>
</svg>