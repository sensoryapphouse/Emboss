<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Tunnel cross section with bold 5.0px stroke -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#000000" stroke-width="5.0"/>
  <!-- Convergence measurement tape chord spanning between sidewalls with bold 4.5px stroke -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#ef4444" stroke-width="4.5" stroke-dasharray="6,3"/>
  <!-- Eyebolt measurement pins anchored in walls with bold 4.0px strokes -->
  <circle cx="20" cy="50" r="4" fill="#0284c7"/>
  <circle cx="80" cy="50" r="4" fill="#0284c7"/>
</svg>