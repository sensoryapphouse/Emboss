  <!-- Metal test block with internal crack flaw with bold 4.5px stroke -->
  <rect x="18" y="40" width="64" height="40" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Piezoelectric ultrasonic probe transducer on top with bold 4.0px stroke -->
  <rect x="42" y="24" width="16" height="16" rx="2" fill="#0284c7" stroke="#000000" stroke-width="3.5"/>
  <!-- Sound wave pulse & internal defect reflection echo with bold 4.0px strokes -->
  <line x1="50" y1="40" x2="50" y2="58" stroke="#ef4444" stroke-width="4.5"/>
  <!-- Internal flaw defect crack line -->
  <line x1="44" y1="58" x2="56" y2="58" stroke="#1e293b" stroke-width="5.0"/>
</svg>