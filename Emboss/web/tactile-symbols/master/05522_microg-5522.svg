  <!-- Two-phase fluid channel with bold 4.5px stroke -->
  <rect x="18" y="24" width="64" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Porous hydrophobic PTFE membrane top (gas exit) with bold 4.0px stroke -->
