<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Central planar carbon transition state with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="10" fill="#1e293b" stroke="#000000" stroke-width="4.0"/>
  <!-- Incoming nucleophile Nu attacking from left with bold 4.5px stroke -->
  <line x1="20" y1="50" x2="40" y2="50" stroke="#22c55e" stroke-width="5.0" stroke-dasharray="4,3"/>
  <circle cx="20" cy="50" r="6" fill="#22c55e" stroke="#000000" stroke-width="3.5"/>
  <!-- Departing leaving group L exiting right with bold 4.5px stroke -->
  <line x1="60" y1="50" x2="80" y2="50" stroke="#ef4444" stroke-width="5.0" stroke-dasharray="4,3"/>
  <circle cx="80" cy="50" r="6" fill="#ef4444" stroke="#000000" stroke-width="3.5"/>
</svg>