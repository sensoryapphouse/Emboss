  <!-- Fish body and caudal tail fin in one continuous path -->
  <path d="M 14 50 C 26 28 66 28 78 50 C 66 72 26 72 14 50 Z" fill="#ffffff" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Caudal tail fin -->
  <polygon points="74,50 90,26 84,50 90,74" fill="#38bdf8" stroke="#000000" stroke-width="4.0" stroke-linejoin="round"/>
  <!-- Eye circle -->
  <circle cx="28" cy="46" r="4" fill="#000000" stroke="#000000" stroke-width="2.5"/>
  <!-- Operculum gill curve -->
  <path d="M 40 38 C 44 46 44 54 40 62" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Dorsal fin -->
  <path d="M 44 31 C 52 20 60 22 66 31" fill="#38bdf8" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
</svg>