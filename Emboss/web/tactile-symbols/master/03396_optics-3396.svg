<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Flat horizontal mirror surface bottom with bold 5.0px stroke -->
  <line x1="18" y1="76" x2="82" y2="76" stroke="#000000" stroke-width="6.5"/>
  <!-- Perpendicular dashed normal line center with bold 3.5px stroke -->
  <line x1="50" y1="20" x2="50" y2="76" stroke="#64748b" stroke-width="4.0" stroke-dasharray="4,4"/>
  <!-- Incident light ray coming down-left with bold 4.5px stroke -->
  <line x1="22" y1="32" x2="50" y2="76" stroke="#ef4444" stroke-width="5.5"/>
  <!-- Reflected light ray bouncing up-right with bold 4.5px stroke -->
  <line x1="50" y1="76" x2="78" y2="32" stroke="#ef4444" stroke-width="5.5"/>
</svg>