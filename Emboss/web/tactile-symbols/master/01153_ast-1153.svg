  <!-- Central spinning neutron star -->
  <circle cx="50" cy="50" r="14" fill="#1e293b" stroke="#000000" stroke-width="4.0"/>
  <!-- Tilted magnetic axis beam cones -->
  <polygon points="50,50 30,16 46,14" fill="#38bdf8" stroke="#000000" stroke-width="3.0"/>
  <polygon points="50,50 70,84 54,86" fill="#38bdf8" stroke="#000000" stroke-width="3.0"/>
  <!-- Spin rotation axis line -->
  <line x1="50" y1="14" x2="50" y2="86" stroke="#000000" stroke-width="3.5" stroke-dasharray="4 3"/>
</svg>