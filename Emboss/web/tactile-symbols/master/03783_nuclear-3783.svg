  <!-- Cylindrical drift volume with bold 4.5px stroke -->
  <rect x="20" y="24" width="60" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Central high voltage cathode membrane with bold 4.5px stroke -->
  <line x1="50" y1="24" x2="50" y2="76" stroke="#ef4444" stroke-width="5.0"/>
  <!-- Left and right drift electric field lines with bold 3.5px strokes -->
  <line x1="50" y1="36" x2="24" y2="36" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="64" x2="76" y2="64" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="3,3"/>
</svg>