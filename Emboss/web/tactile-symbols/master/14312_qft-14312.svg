  <!-- Multiple undulating paths connecting initial and final points with central classical straight path with bold 4.5px strokes -->
  <circle cx="20" cy="50" r="5" fill="#000000"/>
  <circle cx="80" cy="50" r="5" fill="#000000"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#000000" stroke-width="5.0"/>
  <path d="M 20 50 Q 50 20 80 50" stroke="#ef4444" stroke-width="4.5" fill="none"/>
  <path d="M 20 50 Q 50 80 80 50" stroke="#0284c7" stroke-width="4.5" fill="none"/>
</svg>