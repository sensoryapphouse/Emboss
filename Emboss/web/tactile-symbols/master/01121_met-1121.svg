<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Occluded front line running north with alternating triangle and semicircle -->
  <line x1="50" y1="16" x2="50" y2="52" stroke="#9333ea" stroke-width="5.0" stroke-linecap="round"/>
  <polygon points="50,22 60,22 50,30" fill="#9333ea" stroke="#000000" stroke-width="2.0"/>
  <path d="M 50 36 A 6 6 0 0 1 50 48" fill="#9333ea" stroke="#000000" stroke-width="2.0"/>
  <!-- Branching cold front south-west -->
  <line x1="50" y1="52" x2="20" y2="82" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Branching warm front south-east -->
  <line x1="50" y1="52" x2="80" y2="82" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Triple point intersection dot -->
  <circle cx="50" cy="52" r="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
</svg>