<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Osmotic pressure membrane chamber with bold 4.5px stroke -->
  <rect x="20" y="24" width="60" height="52" rx="6" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Semipermeable membrane dividing fresh river water and seawater with bold 4.5px stroke -->
  <line x1="50" y1="24" x2="50" y2="76" stroke="#ef4444" stroke-width="4.5" stroke-dasharray="4,2"/>
  <!-- Fresh water left (cyan) and pressurized salt water right (blue) with bold 4.0px strokes -->
  <circle cx="34" cy="50" r="5" fill="#38bdf8"/>
  <circle cx="66" cy="50" r="5" fill="#0284c7"/>
</svg>