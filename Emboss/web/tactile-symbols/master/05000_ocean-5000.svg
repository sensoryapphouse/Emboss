  <!-- Waterline sea surface line with bold 4.0px stroke -->
  <line x1="14" y1="46" x2="86" y2="46" stroke="#0284c7" stroke-width="4.5"/>
  <!-- Three buoyant vertical column legs with bold 4.5px strokes -->
  <rect x="20" y="32" width="14" height="42" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4.0"/>
  <rect x="66" y="32" width="14" height="42" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4.0"/>
  <!-- Submerged bottom connecting pontoon keel with bold 4.5px stroke -->
  <rect x="20" y="68" width="60" height="10" rx="2" fill="#ef4444" stroke="#000000" stroke-width="3.5"/>
  <!-- Center wind turbine tower rising from platform with bold 5.0px stroke -->
  <line x1="50" y1="68" x2="50" y2="16" stroke="#000000" stroke-width="5.5"/>
</svg>