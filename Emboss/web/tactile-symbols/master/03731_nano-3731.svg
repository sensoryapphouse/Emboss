<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Top sulfur atom layer with bold 4.0px strokes -->
  <circle cx="30" cy="30" r="6" fill="#facc15" stroke="#000000" stroke-width="3.5"/>
  <circle cx="70" cy="30" r="6" fill="#facc15" stroke="#000000" stroke-width="3.5"/>
  <!-- Central molybdenum metal atom layer with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="8" fill="#0284c7" stroke="#000000" stroke-width="4.0"/>
  <!-- Bottom sulfur atom layer with bold 4.0px strokes -->
  <circle cx="30" cy="70" r="6" fill="#facc15" stroke="#000000" stroke-width="3.5"/>
  <circle cx="70" cy="70" r="6" fill="#facc15" stroke="#000000" stroke-width="3.5"/>
  <!-- Chemical coordination bond lines with bold 3.5px strokes -->
  <line x1="50" y1="50" x2="30" y2="30" stroke="#000000" stroke-width="3.5"/>
  <line x1="50" y1="50" x2="70" y2="30" stroke="#000000" stroke-width="3.5"/>
  <line x1="50" y1="50" x2="30" y2="70" stroke="#000000" stroke-width="3.5"/>
  <line x1="50" y1="50" x2="70" y2="70" stroke="#000000" stroke-width="3.5"/>
</svg>