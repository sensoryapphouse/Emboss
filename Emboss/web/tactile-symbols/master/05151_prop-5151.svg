  <!-- Liquid indium metal reservoir base left with bold 4.5px stroke -->
  <rect x="18" y="32" width="24" height="36" rx="3" fill="#cbd5e1" stroke="#000000" stroke-width="4.0"/>
  <!-- Sharp tungsten needle emitter tip wetted with indium with bold 5.0px stroke -->
  <polygon points="42,42 62,50 42,58" fill="#ca8a04" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Extractor electrode ring with high electric field right with bold 4.5px stroke -->
  <rect x="68" y="24" width="8" height="52" rx="2" fill="#ef4444"/>
  <!-- Extracted Taylor cone ion beam shooting right -->
  <line x1="76" y1="50" x2="86" y2="50" stroke="#0284c7" stroke-width="5.0" stroke-linecap="round"/>
</svg>