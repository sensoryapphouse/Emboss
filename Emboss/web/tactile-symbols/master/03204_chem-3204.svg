  <!-- Central carbonyl carbon with bold 4.5px stroke -->
  <circle cx="46" cy="54" r="10" fill="#1e293b" stroke="#000000" stroke-width="4.0"/>
  <!-- Double bond C=O pointing up with bold 4.5px strokes -->
  <line x1="42" y1="44" x2="42" y2="24" stroke="#ef4444" stroke-width="4.5"/>
  <line x1="50" y1="44" x2="50" y2="24" stroke="#ef4444" stroke-width="4.5"/>
  <!-- Terminal hydrogen right with bold 4.0px stroke -->
  <line x1="56" y1="54" x2="78" y2="54" stroke="#000000" stroke-width="5.0"/>
  <circle cx="78" cy="54" r="5" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
</svg>