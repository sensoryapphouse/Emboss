  <!-- Blue field background with bold 4.5px stroke -->
  <rect x="18" y="24" width="64" height="52" fill="#0284c7" stroke="#000000" stroke-width="4.5"/>
  <!-- White saltire cross with bold 5.0px strokes -->
  <line x1="18" y1="24" x2="82" y2="76" stroke="#ffffff" stroke-width="10.0"/>
  <line x1="18" y1="76" x2="82" y2="24" stroke="#ffffff" stroke-width="10.0"/>
  <!-- Red saltire lines -->
  <line x1="18" y1="24" x2="82" y2="76" stroke="#ef4444" stroke-width="4.0"/>
  <line x1="18" y1="76" x2="82" y2="24" stroke="#ef4444" stroke-width="4.0"/>
  <!-- Centered red cross with white border with bold 5.0px strokes -->
  <line x1="18" y1="50" x2="82" y2="50" stroke="#ffffff" stroke-width="14.0"/>
  <line x1="50" y1="24" x2="50" y2="76" stroke="#ffffff" stroke-width="14.0"/>
  <line x1="18" y1="50" x2="82" y2="50" stroke="#ef4444" stroke-width="8.0"/>
  <line x1="50" y1="24" x2="50" y2="76" stroke="#ef4444" stroke-width="8.0"/>
