  <line x1="56" y1="36" x2="44" y2="52" stroke="#0284c7" stroke-width="3.5"/>
  <!-- Insulator strings suspended from crossarm tips with bold 4.0px strokes -->
  <line x1="22" y1="36" x2="22" y2="46" stroke="#ef4444" stroke-width="4.5"/>
  <line x1="78" y1="36" x2="78" y2="46" stroke="#ef4444" stroke-width="4.5"/>
