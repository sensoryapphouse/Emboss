  <!-- Ground baseline -->
  <line x1="12" y1="84" x2="88" y2="84" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Steep wedge boundary of advancing dense cold air pushing up warm air -->
  <path d="M 12 84 C 36 84 48 64 54 36" fill="none" stroke="#0284c7" stroke-width="5.0" stroke-linecap="round"/>
  <!-- Cumulonimbus vertical cloud at frontal boundary -->
  <path d="M 52 34 C 52 20 78 20 78 34 C 84 42 78 54 70 54 L 56 54 Z" fill="#ffffff" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Cold front triangle barb on front edge -->
  <polygon points="34,84 42,72 48,84" fill="#0284c7" stroke="#000000" stroke-width="2.5"/>
</svg>