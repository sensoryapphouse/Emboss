  <!-- Microfluidic slide counting grid frame with bold 4.5px stroke -->
  <rect x="20" y="20" width="60" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Viable live cells (unstained clear) with bold 4.0px strokes -->
  <circle cx="36" cy="38" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="4.0"/>
  <circle cx="64" cy="62" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="4.0"/>
  <!-- Non-viable dead cells (trypan blue stained dark) with bold 4.0px strokes -->
  <circle cx="62" cy="38" r="6" fill="#1e293b"/>
  <circle cx="38" cy="62" r="6" fill="#1e293b"/>
</svg>