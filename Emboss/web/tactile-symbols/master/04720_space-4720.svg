  <!-- Central Earth body with bold 4.0px stroke -->
  <circle cx="50" cy="50" r="10" fill="#0284c7"/>
  <!-- Low Earth Orbit (LEO) inner circle with bold 4.0px stroke -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#000000" stroke-width="4.0"/>
  <!-- Geostationary (GEO) outer circle with bold 4.0px stroke -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#000000" stroke-width="4.0"/>
  <!-- Semi-elliptical Hohmann transfer trajectory curve connecting orbits with bold 5.0px stroke -->
  <path d="M 50 30 C 68 30 84 50 84 50 C 84 72 50 84 50 84" fill="none" stroke="#ef4444" stroke-width="5.0"/>
</svg>