<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Stone castle wall gateway left with bold 4.5px stroke -->
  <rect x="18" y="24" width="16" height="54" fill="#94a3b8" stroke="#000000" stroke-width="4.0"/>
  <!-- Hinged wooden drawbridge ramp lifted diagonally with bold 4.5px stroke -->
  <line x1="34" y1="78" x2="68" y2="44" stroke="#8a5a2b" stroke-width="7.0" stroke-linecap="round"/>
  <!-- Overhead iron lifting chain with bold 3.5px stroke -->
  <line x1="34" y1="36" x2="68" y2="44" stroke="#000000" stroke-width="3.5" stroke-dasharray="3,3"/>
  <!-- Water moat beneath with bold 4.0px stroke -->
  <line x1="34" y1="78" x2="82" y2="78" stroke="#0284c7" stroke-width="6.0"/>
</svg>