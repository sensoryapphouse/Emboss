  <!-- Fibrous roots spreading below with bold 4.0px strokes -->
  <line x1="50" y1="64" x2="38" y2="78" stroke="#8a5a2b" stroke-width="4.5"/>
  <line x1="50" y1="64" x2="62" y2="78" stroke="#8a5a2b" stroke-width="4.5"/>
