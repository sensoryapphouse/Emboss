<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Friction boundary circle with bold 4.5px stroke -->
  <circle cx="50" cy="50" r="32" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Longitudinal force axis and lateral cornering force axis with bold 4.0px strokes -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="#cbd5e1" stroke-width="4.0"/>
  <line x1="18" y1="50" x2="82" y2="50" stroke="#cbd5e1" stroke-width="4.0"/>
  <!-- Combined resultant traction vector reaching friction limit with bold 5.0px stroke -->
  <line x1="50" y1="50" x2="72" y2="28" stroke="#ef4444" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="4" fill="#000000"/>
</svg>