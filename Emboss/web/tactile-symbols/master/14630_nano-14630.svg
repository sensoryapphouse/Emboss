  <line x1="50" y1="50" x2="70" y2="30" stroke="#0284c7" stroke-width="4.5"/>
  <line x1="50" y1="50" x2="30" y2="70" stroke="#0284c7" stroke-width="4.5"/>
  <line x1="50" y1="50" x2="70" y2="70" stroke="#0284c7" stroke-width="4.5"/>
  <circle cx="30" cy="30" r="4" fill="#ef4444"/>
  <circle cx="70" cy="30" r="4" fill="#ef4444"/>
  <circle cx="30" cy="70" r="4" fill="#ef4444"/>
  <circle cx="70" cy="70" r="4" fill="#ef4444"/>
</svg>