<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Three main structural rebar chords forming triangular truss with bold 4.5px strokes -->
  <circle cx="50" cy="24" r="5" fill="#1e293b"/>
  <circle cx="30" cy="68" r="5" fill="#1e293b"/>
  <circle cx="70" cy="68" r="5" fill="#1e293b"/>
  <!-- Diagonal stiffener bars welded between chords with bold 4.5px strokes -->
  <line x1="50" y1="24" x2="30" y2="68" stroke="#ef4444" stroke-width="4.5"/>
  <line x1="50" y1="24" x2="70" y2="68" stroke="#ef4444" stroke-width="4.5"/>
  <line x1="30" y1="68" x2="70" y2="68" stroke="#ef4444" stroke-width="4.5"/>
</svg>