<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Spacecraft hull body top with bold 4.5px stroke -->
  <rect x="30" y="16" width="40" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4.0"/>
  <!-- Two-stage pneumatic shock absorber pistons in middle with bold 4.5px strokes -->
  <line x1="38" y1="40" x2="38" y2="58" stroke="#0284c7" stroke-width="5.0"/>
  <line x1="62" y1="40" x2="62" y2="58" stroke="#0284c7" stroke-width="5.0"/>
  <!-- Heavy steel pusher plate absorbing nuclear blast bottom with bold 5.0px stroke -->
  <rect x="20" y="58" width="60" height="12" rx="2" fill="#1e293b" stroke="#000000" stroke-width="4.5"/>
  <!-- Nuclear shaped-charge detonation starburst below -->
  <circle cx="50" cy="80" r="6" fill="#ef4444"/>
</svg>