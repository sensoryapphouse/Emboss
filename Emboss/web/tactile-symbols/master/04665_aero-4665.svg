  <!-- Glass cockpit bezel frame with bold 4.5px stroke -->
  <rect x="18" y="18" width="64" height="64" rx="6" fill="#1e293b" stroke="#000000" stroke-width="4.5"/>
  <!-- Artificial horizon blue sky / brown ground divider with bold 4.5px stroke -->
  <line x1="24" y1="50" x2="76" y2="50" stroke="#ffffff" stroke-width="4.5"/>
  <!-- Aircraft pitch symbol and flight director crosshairs in center with bold 4.0px stroke -->
  <circle cx="50" cy="50" r="4" fill="#facc15"/>
  <polyline points="38,50 46,50 50,44 54,50 62,50" fill="none" stroke="#facc15" stroke-width="4.0"/>
</svg>