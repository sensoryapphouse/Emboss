  <!-- Twin tandem GRACE satellites measuring sub-micrometer separation with bold 4.5px strokes -->
  <polygon points="16,56 32,44 32,68" fill="#ffffff" stroke="#000000" stroke-width="4.0" stroke-linejoin="round"/>
  <polygon points="68,56 84,44 84,68" fill="#ffffff" stroke="#000000" stroke-width="4.0" stroke-linejoin="round"/>
  <!-- Laser inter-satellite ranging beam spanning distance in center with bold 4.5px stroke -->
  <line x1="32" y1="56" x2="68" y2="56" stroke="#ef4444" stroke-width="5.0" stroke-dasharray="5,2"/>
</svg>