  <line x1="24" y1="20" x2="50" y2="50" stroke="#ef4444" stroke-width="4.0" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="66" y2="84" stroke="#ef4444" stroke-width="4.0" stroke-linecap="round"/>
