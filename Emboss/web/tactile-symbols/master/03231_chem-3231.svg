  <!-- Electronegative donor oxygen left with bold 4.5px stroke -->
  <circle cx="26" cy="50" r="10" fill="#ef4444" stroke="#000000" stroke-width="4.0"/>
  <!-- Polarized hydrogen atom with bold 4.0px stroke -->
  <circle cx="46" cy="50" r="6" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
  <!-- Dashed electrostatic hydrogen bond line with bold 5.0px stroke -->
  <line x1="52" y1="50" x2="66" y2="50" stroke="#0284c7" stroke-width="5.5" stroke-dasharray="4,3"/>
  <!-- Acceptor oxygen right with bold 4.5px stroke -->
  <circle cx="76" cy="50" r="10" fill="#ef4444" stroke="#000000" stroke-width="4.0"/>
</svg>