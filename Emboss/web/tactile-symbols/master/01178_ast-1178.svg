  <!-- Inner circular origin orbit (Earth) -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#0284c7" stroke-width="3.5"/>
  <!-- Outer circular target orbit (Mars) -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#ef4444" stroke-width="4.5"/>
  <!-- Elliptical transfer trajectory arc connecting periapsis to apoapsis -->
  <path d="M 32 50 C 32 74 68 86 86 50" fill="none" stroke="#000000" stroke-width="4.5" stroke-dasharray="6 3"/>
