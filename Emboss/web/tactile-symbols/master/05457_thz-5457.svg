  <!-- Waveguide 1 with optical gain (green/yellow) with bold 5.0px stroke -->
  <rect x="18" y="28" width="64" height="14" rx="3" fill="#22c55e" stroke="#000000" stroke-width="4.0"/>
  <!-- Waveguide 2 with balanced optical loss (red/purple) with bold 5.0px stroke -->
