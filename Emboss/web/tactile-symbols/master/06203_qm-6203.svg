  <!-- 2x2 Readout assignment matrix container with bold 4.5px stroke -->
  <rect x="20" y="20" width="60" height="60" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Diagonal dominant elements (P00 and P11) vs off-diagonal crosstalk (P01 and P10) -->
  <rect x="24" y="24" width="24" height="24" fill="#0284c7"/>
  <rect x="52" y="52" width="24" height="24" fill="#0284c7"/>
  <rect x="52" y="24" width="24" height="24" fill="#ef4444"/>
  <rect x="24" y="52" width="24" height="24" fill="#ef4444"/>
</svg>