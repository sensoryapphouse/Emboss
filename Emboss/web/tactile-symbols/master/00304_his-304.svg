  <!-- Triangular pediment roof -->
  <polygon points="14,32 50,16 86,32" fill="#ffffff" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- 4 Doric columns with 14px clearance -->
  <line x1="22" y1="32" x2="22" y2="76" stroke="#000000" stroke-width="4.5"/>
  <line x1="40" y1="32" x2="40" y2="76" stroke="#000000" stroke-width="4.5"/>
  <line x1="60" y1="32" x2="60" y2="76" stroke="#000000" stroke-width="4.5"/>
  <line x1="78" y1="32" x2="78" y2="76" stroke="#000000" stroke-width="4.5"/>
  <!-- Base steps stylobate -->
  <rect x="12" y="76" width="76" height="10" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
</svg>