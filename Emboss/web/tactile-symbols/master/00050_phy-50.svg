<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Central atomic nucleus with protons/neutrons -->
  <circle cx="50" cy="50" r="12" fill="#ef4444" stroke="#000000" stroke-width="4.5"/>
  <!-- Tilted electron orbital ellipse 1 (45 deg) -->
  <ellipse cx="50" cy="50" rx="38" ry="14" transform="rotate(45 50 50)" fill="none" stroke="#000000" stroke-width="3.5"/>
  <!-- Tilted electron orbital ellipse 2 (-45 deg) -->
  <ellipse cx="50" cy="50" rx="38" ry="14" transform="rotate(-45 50 50)" fill="none" stroke="#000000" stroke-width="3.5"/>
  <!-- Orbiting electron dots with clear separation -->
  <circle cx="74" cy="26" r="4" fill="#38bdf8" stroke="#000000" stroke-width="2.5"/>
  <circle cx="26" cy="26" r="4" fill="#38bdf8" stroke="#000000" stroke-width="2.5"/>
</svg>