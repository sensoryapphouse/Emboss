<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Two colliding gamma-ray photons converting into electron-positron pair with bold 4.5px strokes -->
  <path d="M 18 24 Q 34 38 50 50" fill="none" stroke="#ca8a04" stroke-width="4.5"/>
  <path d="M 18 76 Q 34 62 50 50" fill="none" stroke="#ca8a04" stroke-width="4.5"/>
  <!-- Emitted electron (blue) and positron (red) trajectories right with bold 5.0px strokes -->
  <line x1="50" y1="50" x2="82" y2="30" stroke="#0284c7" stroke-width="5.0"/>
  <line x1="50" y1="50" x2="82" y2="70" stroke="#ef4444" stroke-width="5.0"/>
  <!-- Pair creation vertex in center -->
  <circle cx="50" cy="50" r="6" fill="#ef4444"/>
</svg>