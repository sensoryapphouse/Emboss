  <!-- Geostationary gigawatt solar collector array top with bold 4.5px stroke -->
  <rect x="20" y="16" width="60" height="16" rx="2" fill="#ffffff" stroke="#0284c7" stroke-width="4.0"/>
  <!-- Phased array transmitter antenna disc in center with bold 4.5px stroke -->
  <circle cx="50" cy="40" r="10" fill="#ffffff" stroke="#ef4444" stroke-width="4.0"/>
  <!-- 5.8 GHz microwave power beam beaming downward with bold 4.5px strokes -->
  <line x1="44" y1="50" x2="30" y2="82" stroke="#facc15" stroke-width="4.5"/>
  <line x1="56" y1="50" x2="70" y2="82" stroke="#facc15" stroke-width="4.5"/>
</svg>