  <!-- 3 Orthogonal alternating CLT wood board layers with bold 4.5px strokes -->
  <rect x="20" y="24" width="60" height="14" fill="#ca8a04" stroke="#000000" stroke-width="4.0"/>
  <rect x="20" y="42" width="60" height="16" fill="#fde047" stroke="#000000" stroke-width="4.0"/>
  <rect x="20" y="62" width="60" height="14" fill="#ca8a04" stroke="#000000" stroke-width="4.0"/>
  <!-- Cross-grain hatched lines in middle layer with bold 3.0px strokes -->
  <line x1="35" y1="42" x2="35" y2="58" stroke="#000000" stroke-width="3.0"/>
  <line x1="50" y1="42" x2="50" y2="58" stroke="#000000" stroke-width="3.0"/>
  <line x1="65" y1="42" x2="65" y2="58" stroke="#000000" stroke-width="3.0"/>
</svg>