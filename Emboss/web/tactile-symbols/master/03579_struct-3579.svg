<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Coordinate axes (Normal stress sigma vs Shear stress tau) with bold 4.5px stroke -->
  <polyline points="20,20 20,80 80,80" fill="none" stroke="#000000" stroke-width="4.5"/>
  <!-- Mohr's stress circle centered on axis with bold 4.5px stroke -->
  <circle cx="52" cy="52" r="22" fill="none" stroke="#ef4444" stroke-width="5.0"/>
  <!-- Diameter line linking stress states with bold 3.5px stroke -->
  <line x1="34" y1="64" x2="70" y2="40" stroke="#0284c7" stroke-width="4.0"/>
</svg>