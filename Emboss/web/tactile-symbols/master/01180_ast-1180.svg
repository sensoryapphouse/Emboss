  <!-- Planet Earth center -->
  <circle cx="50" cy="50" r="14" fill="#38bdf8" stroke="#000000" stroke-width="3.5"/>
  <!-- Equatorial Geostationary Ring (GEO) -->
  <ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="#000000" stroke-width="4.5"/>
  <!-- Inclined Polar Low Earth Orbit (LEO) ring -->
  <ellipse cx="50" cy="50" rx="10" ry="24" transform="rotate(15 50 50)" fill="none" stroke="#ef4444" stroke-width="3.5"/>
</svg>