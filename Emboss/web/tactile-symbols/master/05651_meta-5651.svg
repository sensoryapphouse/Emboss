<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- Planar metasurface lens base with bold 4.5px stroke -->
  <rect x="18" y="24" width="64" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Red and blue multi-wavelength rays focusing onto exact same focal point bottom with bold 4.5px strokes -->
  <line x1="28" y1="36" x2="50" y2="78" stroke="#ef4444" stroke-width="4.5"/>
  <line x1="72" y1="36" x2="50" y2="78" stroke="#0284c7" stroke-width="4.5"/>
  <!-- Achromatic focal point dot bottom -->
  <circle cx="50" cy="78" r="6" fill="#ca8a04"/>
</svg>