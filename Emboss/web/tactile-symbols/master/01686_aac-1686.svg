  <!-- Analog clock dial -->
  <circle cx="50" cy="50" r="34" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- 12, 3, 6, 9 Cardinal hour ticks -->
  <circle cx="50" cy="22" r="3" fill="#000000"/>
  <circle cx="78" cy="50" r="3" fill="#000000"/>
  <circle cx="50" cy="78" r="3" fill="#000000"/>
  <circle cx="22" cy="50" r="3" fill="#000000"/>
  <!-- Hour and minute hands showing 3 o'clock -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#ef4444" stroke-width="5.0" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="70" y2="50" stroke="#0284c7" stroke-width="5.0" stroke-linecap="round"/>
</svg>