<svg data-copyright="© 2026 Sensory App House Ltd" xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 100 100" width="100" height="100">
  <!-- 40-foot modular shipping container housing with bold 4.5px stroke -->
  <rect x="16" y="30" width="68" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Vertical battery module rack doors with bold 4.0px strokes -->
  <line x1="33" y1="30" x2="33" y2="72" stroke="#000000" stroke-width="4.0"/>
  <line x1="50" y1="30" x2="50" y2="72" stroke="#000000" stroke-width="4.0"/>
  <line x1="67" y1="30" x2="67" y2="72" stroke="#000000" stroke-width="4.0"/>
  <!-- Green energy storage charge symbol on door with bold 3.5px strokes -->
  <polygon points="42,42 46,50 40,50 44,60" fill="#22c55e"/>
</svg>