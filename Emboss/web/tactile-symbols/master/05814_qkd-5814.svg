  <line x1="70" y1="50" x2="84" y2="66" stroke="#0284c7" stroke-width="5.0"/>
  <!-- Trapped atomic ensemble cloud in center -->
  <circle cx="50" cy="50" r="8" fill="#ca8a04"/>
</svg>