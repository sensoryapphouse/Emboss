  <!-- Cold rubidium atomic gas vapor cell with bold 4.5px stroke -->
  <ellipse cx="50" cy="50" rx="30" ry="20" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
  <!-- Single-photon Stokes and anti-Stokes Raman emission rays with bold 4.5px strokes -->
