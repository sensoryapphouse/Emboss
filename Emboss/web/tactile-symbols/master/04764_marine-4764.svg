  <!-- Three seabed acoustic transponder nodes forming triangulation grid with bold 4.5px strokes -->
  <circle cx="22" cy="74" r="8" fill="#1e293b" stroke="#ef4444" stroke-width="3.5"/>
  <circle cx="78" cy="74" r="8" fill="#1e293b" stroke="#ef4444" stroke-width="3.5"/>
  <circle cx="50" cy="24" r="8" fill="#1e293b" stroke="#ef4444" stroke-width="3.5"/>
  <!-- Triangular acoustic baseline ranging lines with bold 4.0px strokes -->
