  <!-- Down quark transforming to Up quark with bold 4.5px stroke -->
  <line x1="20" y1="36" x2="46" y2="36" stroke="#0284c7" stroke-width="5.0"/>
  <line x1="46" y1="36" x2="80" y2="22" stroke="#0284c7" stroke-width="5.0"/>
  <!-- W- boson wavy propagator descending with bold 4.5px stroke -->
  <path d="M 46 36 Q 52 46 46 56 Q 40 66 46 72" fill="none" stroke="#ca8a04" stroke-width="4.5"/>
  <!-- Electron and antineutrino branching right with bold 4.5px strokes -->
  <line x1="46" y1="72" x2="80" y2="60" stroke="#ef4444" stroke-width="5.0"/>
  <line x1="46" y1="72" x2="80" y2="82" stroke="#1e293b" stroke-width="4.5" stroke-dasharray="3,3"/>
</svg>